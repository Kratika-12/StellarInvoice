name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Run contract tests
        working-directory: ./contracts/invoice
        run: cargo test
      - name: Build contract
        working-directory: ./contracts/invoice
        run: cargo build --target wasm32v1-none --release
      - name: Upload contract WASM
        uses: actions/upload-artifact@v4
        with:
          name: stellar-invoice-contract
          path: contracts/invoice/target/wasm32v1-none/release/stellar_invoice_contract.wasm
